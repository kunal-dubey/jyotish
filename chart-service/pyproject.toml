[project]
name = "chart-service"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Kunal Dubey", email = "kunal.dubey@zoho.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pyswisseph>=2.10.3.2",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
chart-service = "chart_service:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
